; Overrides for the stock php-fpm.conf and www.conf, loaded last because of the zz- prefix.
[global]
; docker stop sends SIGQUIT, and this lets running requests finish for up to 8s before workers are
; killed. With the default of 0 they are killed straight away. Docker kills everything after 10s.
process_control_timeout = 8s

[www]
; Workers start when requests arrive and exit after 30s idle, so a quiet app holds no workers.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
